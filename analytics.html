<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AGW — Intellektuelle Geschichte · Analytics</title>
  <meta name="description" content="Quantitative analysis of 43 AGW conference volumes, 1980–2025">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">

  <!-- ── ES Module import map — resolves bare specifiers to CDN ── -->
  <script type="importmap">
  {
    "imports": {
      "react":             "https://esm.sh/react@18",
      "react-dom/client":  "https://esm.sh/react-dom@18/client",
      "react/jsx-runtime": "https://esm.sh/react@18/jsx-runtime",
      "recharts":          "https://esm.sh/recharts@2",
      "d3":                "https://esm.sh/d3@7"
    }
  }
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:   #1B3A6B;
      --navy2:  #152D54;
      --gold:   #B45309;
      --border: #E5E7EB;
      --bg:     #F9FAFB;
      --text:   #111827;
      --muted:  #6B7280;
      --radius: 3px;
      --font-serif: 'EB Garamond', Georgia, serif;
      --font-sans:  'Source Sans 3', system-ui, sans-serif;
    }

    html { font-family: var(--font-sans); color: var(--text); background: var(--bg); }

    /* ── Top bar ── */
    .topbar {
      background: var(--navy);
      color: #fff;
      padding: 0 24px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 1px 4px rgba(0,0,0,.25);
    }
    .topbar-brand {
      font-family: var(--font-serif);
      font-size: 17px;
      letter-spacing: .04em;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .topbar-back {
      font-size: 12px;
      color: rgba(255,255,255,.65);
      text-decoration: none;
      letter-spacing: .05em;
    }
    .topbar-back:hover { color: #fff; }
    .topbar-actions { display: flex; align-items: center; gap: 12px; }
    .lang-btn {
      background: none;
      border: 1px solid rgba(255,255,255,.3);
      color: rgba(255,255,255,.7);
      padding: 3px 10px;
      border-radius: 2px;
      cursor: pointer;
      font-family: inherit;
      font-size: 11px;
      letter-spacing: .1em;
    }
    .lang-btn.active { background: rgba(255,255,255,.15); color: #fff; }

    /* ── Tool tabs ── */
    .tool-tabs {
      background: #fff;
      border-bottom: 2px solid var(--border);
      padding: 0 24px;
      display: flex;
      gap: 0;
      overflow-x: auto;
    }
    .tool-tab {
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      padding: 12px 20px;
      cursor: pointer;
      font-family: var(--font-sans);
      font-size: 13px;
      color: var(--muted);
      white-space: nowrap;
      letter-spacing: .03em;
    }
    .tool-tab:hover { color: var(--text); }
    .tool-tab.active { color: var(--navy); border-bottom-color: var(--navy);
      font-weight: 600; }

    /* ── Content panels ── */
    .tool-panel { display: none; }
    .tool-panel.active { display: block; }

    /* ── Loading state ── */
    .loading {
      padding: 60px 24px;
      text-align: center;
      color: var(--muted);
      font-family: var(--font-serif);
      font-size: 15px;
      font-style: italic;
    }
    .loading::before {
      content: '';
      display: block;
      width: 32px;
      height: 32px;
      border: 2px solid var(--border);
      border-top-color: var(--navy);
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Error state ── */
    .bundle-error {
      margin: 32px 24px;
      padding: 20px 24px;
      background: #FEF2F2;
      border: 1px solid #FECACA;
      border-radius: var(--radius);
      font-size: 13px;
      color: #991B1B;
      line-height: 1.6;
    }
    .bundle-error code {
      display: block;
      margin: 10px 0;
      padding: 10px 14px;
      background: #FFF;
      border: 1px solid #FECACA;
      border-radius: 2px;
      font-family: monospace;
      font-size: 12px;
      color: #374151;
      white-space: pre;
    }

    /* ── Footer ── */
    .page-footer {
      margin-top: 40px;
      padding: 20px 24px;
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>
</head>
<body>

  <!-- ── Top bar ── -->
  <header class="topbar">
    <div class="topbar-brand">
      <span style="font-weight:600;">AGW</span>
      <span style="opacity:.4">·</span>
      <span id="topbar-title" style="opacity:.85;">Analytics</span>
    </div>
    <div class="topbar-actions">
      <a class="topbar-back" href="index.html">← <span data-i18n="back">Zurück zur Tagungsseite</span></a>
      <button class="lang-btn active" id="btn-de" onclick="setLang('de')">DE</button>
      <button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button>
    </div>
  </header>

  <!-- ── Tab bar ── -->
  <nav class="tool-tabs" role="tablist">
    <button class="tool-tab active" onclick="showTool('gaze',this)"
      id="tab-gaze" data-i18n-tab="tab_gaze">🗺 Gaze Map</button>
    <button class="tool-tab" onclick="showTool('analysis',this)"
      id="tab-analysis" data-i18n-tab="tab_analysis">📊 Analysen A–E</button>
    <button class="tool-tab" onclick="showTool('pmi',this)"
      id="tab-pmi" data-i18n-tab="tab_pmi">🔬 Themenanalyse</button>
  </nav>

  <!-- ── Tool panels ── -->
  <main>
    <div class="tool-panel active" id="panel-gaze">
      <div class="loading" id="loading-gaze" data-i18n="loading">Lade Gaze Map…</div>
      <div id="mount-gaze"></div>
    </div>

    <div class="tool-panel" id="panel-analysis">
      <div class="loading" id="loading-analysis" data-i18n="loading">Lade Analysen…</div>
      <div id="mount-analysis"></div>
    </div>

    <div class="tool-panel" id="panel-pmi">
      <div class="loading" id="loading-pmi" data-i18n="loading">Lade Themenanalyse…</div>
      <div id="mount-pmi"></div>
    </div>
  </main>

  <footer class="page-footer">
    <span>AGW · Ausschuss für die Geschichte der Wirtschaftswissenschaften · Verein für Socialpolitik</span>
    <span>© 2025 · <a href="mailto:bieri@vt.edu" style="color:var(--muted);">bieri@vt.edu</a></span>
  </footer>

  <!-- ── Language & tabs ── -->
  <script>
    const EN_ANA = {
      back:          'Back to Conference Site',
      loading:       'Loading…',
      tab_gaze:      '🗺 Gaze Map',
      tab_analysis:  '📊 Analytics A–E',
      tab_pmi:       '🔬 Topic Analysis',
      bundle_title:  'Bundle not found',
      bundle_body:   'Run the build script in WSL first:',
      bundle_hint:   'Then commit the dist/ folder and reload.',
    };
    const DE_ANA = {
      back:          'Zurück zur Tagungsseite',
      loading:       'Lade…',
      tab_gaze:      '🗺 Gaze Map',
      tab_analysis:  '📊 Analysen A–E',
      tab_pmi:       '🔬 Themenanalyse',
      bundle_title:  'Bundle nicht gefunden',
      bundle_body:   'Build-Skript in WSL ausführen:',
      bundle_hint:   'Dann dist/ committen und neu laden.',
    };

    let _lang = localStorage.getItem('agw-lang') || 'de';

    function setLang(l) {
      _lang = l;
      localStorage.setItem('agw-lang', l);
      document.getElementById('btn-de').classList.toggle('active', l==='de');
      document.getElementById('btn-en').classList.toggle('active', l==='en');
      const strings = l==='de' ? DE_ANA : EN_ANA;
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const k = el.getAttribute('data-i18n');
        if (strings[k]) el.textContent = strings[k];
      });
      document.querySelectorAll('[data-i18n-tab]').forEach(el => {
        const k = el.getAttribute('data-i18n-tab');
        if (strings[k]) el.textContent = strings[k];
      });
    }

    // Active tab
    let _activePanel = 'gaze';
    function showTool(name, btn) {
      document.querySelectorAll('.tool-panel').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.tool-tab').forEach(b => b.classList.remove('active'));
      document.getElementById('panel-'+name).classList.add('active');
      btn.classList.add('active');
      _activePanel = name;
    }

    function showBundleError(mountId, loadingId, filename) {
      const strings = _lang==='de' ? DE_ANA : EN_ANA;
      document.getElementById(loadingId).style.display = 'none';
      document.getElementById(mountId).innerHTML = `
        <div class="bundle-error">
          <strong>${strings.bundle_title}: dist/${filename}</strong><br>
          ${strings.bundle_body}
          <code>bash build_analytics.sh</code>
          ${strings.bundle_hint}
        </div>`;
    }

    // Apply initial language
    setLang(_lang);
  </script>

  <!-- ── Mount React components via compiled ESM bundles ── -->
  <!-- Each import() is lazy — only loads when first needed    -->
  <script type="module">
    import { createElement } from 'react';
    import { createRoot }    from 'react-dom/client';

    function mountWhenVisible(panelId, mountId, loadingId, bundlePath, rootRef) {
      if (rootRef.root) return;  // already mounted

      import(bundlePath).then(mod => {
        document.getElementById(loadingId).style.display = 'none';
        const Component = mod.default;
        rootRef.root = createRoot(document.getElementById(mountId));
        rootRef.root.render(createElement(Component, null));
      }).catch(err => {
        const fname = bundlePath.replace('./dist/','');
        showBundleError(mountId, loadingId, fname);
        console.warn('Bundle load failed:', bundlePath, err);
      });
    }

    // Roots (lazy)
    const roots = { gaze:{}, analysis:{}, pmi:{} };

    // Mount gaze map immediately (first visible tab)
    mountWhenVisible(
      'panel-gaze', 'mount-gaze', 'loading-gaze',
      './dist/agw_gaze_map.js', roots.gaze);

    // Mount others on first tab click
    document.getElementById('tab-analysis').addEventListener('click', () => {
      mountWhenVisible('panel-analysis','mount-analysis','loading-analysis',
        './dist/agw_analysis.js', roots.analysis);
    }, {once:false});

    document.getElementById('tab-pmi').addEventListener('click', () => {
      mountWhenVisible('panel-pmi','mount-pmi','loading-pmi',
        './dist/agw_pmi.js', roots.pmi);
    }, {once:false});
  </script>

</body>
</html>
