<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AGW — Intellektuelle Geschichte · Analytics</title>
  <meta name="description" content="Quantitative analysis of 43 AGW conference volumes, 1980–2025">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Source+Sans+3:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- ES module import map — resolves bare specifiers to CDN -->
  <!-- recharts MUST use ?external=react,react-dom or it bundles its own       -->
  <!-- React, causing "Cannot read properties of null (reading 'useRef')" in  -->
  <!-- ResponsiveContainer (two React instances, no shared hook dispatcher). -->
  <script type="importmap">
  {
    "imports": {
      "react":             "./vendor/react.mjs",
      "react-dom":         "https://esm.sh/react-dom@18",
      "react-dom/client":  "./vendor/react-dom-client.mjs",
      "react/jsx-runtime": "./vendor/react-jsx-runtime.mjs",
      "recharts":          "https://esm.sh/recharts@2?external=react,react-dom",
      "d3":                "https://esm.sh/d3@7"
    }
  }
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── CSS variables — identical to index.html ── */
    :root {
      --navy:         #1B3A6B;
      --navy-dark:    #122852;
      --navy-mid:     #24477F;
      --accent:       #3A6BAF;
      --accent-pale:  #EAF0F8;
      --gold:         #B8860B;
      --gold-light:   #F5EED0;
      --cream:        #FAFAF7;
      --white:        #FFFFFF;
      --text-dark:    #1C1C1E;
      --text-body:    #2C2C30;
      --text-muted:   #6B7280;
      --text-faint:   #9CA3AF;
      --border:       #DDE2EA;
      --border-light: #EEF1F5;
      --green:        #4A7C59;
      --green-pale:   #EAF2EC;
    }

    html { scroll-behavior: smooth; font-size: 16px; }
    body {
      font-family: 'Source Sans 3', sans-serif;
      color: var(--text-body);
      background: var(--cream);
      line-height: 1.65;
    }

    /* ── Nav — exact match to index.html ── */
    .nav {
      position: sticky;
      top: 0;
      z-index: 200;
      background: var(--navy-dark);
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }
    .nav-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      height: 56px;
      padding: 0 1.5rem;
      gap: 0;
    }
    .nav-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #fff;
      font-family: 'EB Garamond', Georgia, serif;
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 0.04em;
      flex-shrink: 0;
    }
    .nav-brand-sep {
      width: 1px;
      height: 18px;
      background: rgba(255,255,255,0.25);
    }
    .nav-brand-sub {
      font-size: 12px;
      font-family: 'Source Sans 3', sans-serif;
      font-weight: 400;
      letter-spacing: 0.06em;
      color: rgba(255,255,255,0.6);
      text-transform: uppercase;
    }
    .nav-back {
      font-size: 12px;
      color: rgba(255,255,255,0.55);
      text-decoration: none;
      letter-spacing: 0.05em;
      margin-left: 24px;
      transition: color .15s;
    }
    .nav-back:hover { color: rgba(255,255,255,0.9); }
    .nav-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
      flex-shrink: 0;
    }

    /* ── Language toggle — exact match to index.html ── */
    .lang-toggle {
      display: flex;
      align-items: center;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 100px;
      padding: 4px 2px;
      gap: 0;
      cursor: pointer;
      font-family: 'Source Sans 3', sans-serif;
    }
    .lang-btn {
      padding: 3px 9px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: rgba(255,255,255,0.45);
      border-radius: 100px;
      transition: background .15s, color .15s;
      border: none;
      background: none;
      cursor: pointer;
      font-family: inherit;
    }
    .lang-btn.active {
      background: rgba(255,255,255,0.18);
      color: #fff;
    }

    /* ── Tool tabs ── */
    .tool-tabs {
      background: var(--white);
      border-bottom: 2px solid var(--border);
      padding: 0 1.5rem;
      display: flex;
      gap: 0;
      overflow-x: auto;
    }
    .tool-tab {
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      padding: 13px 20px;
      cursor: pointer;
      font-family: 'Source Sans 3', sans-serif;
      font-size: 13.5px;
      font-weight: 400;
      color: var(--text-muted);
      white-space: nowrap;
      letter-spacing: 0.02em;
      transition: color .15s;
    }
    .tool-tab:hover { color: var(--text-dark); }
    .tool-tab.active {
      color: var(--navy);
      border-bottom-color: var(--navy);
      font-weight: 600;
    }

    /* ── Panel wrapper ── */
    .tool-panel { display: none; }
    .tool-panel.active { display: block; }

    /* ── Loading state ── */
    .loading {
      padding: 64px 1.5rem;
      text-align: center;
      color: var(--text-muted);
      font-family: 'EB Garamond', Georgia, serif;
      font-size: 16px;
      font-style: italic;
    }
    .loading::before {
      content: '';
      display: block;
      width: 28px;
      height: 28px;
      border: 2px solid var(--border);
      border-top-color: var(--navy);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Bundle-missing error ── */
    .bundle-error {
      margin: 32px auto;
      max-width: 560px;
      padding: 20px 24px;
      background: #FEF2F2;
      border: 1px solid #FECACA;
      border-radius: 4px;
      font-size: 13.5px;
      color: #991B1B;
      line-height: 1.65;
    }
    .bundle-error code {
      display: block;
      margin: 10px 0;
      padding: 10px 14px;
      background: var(--white);
      border: 1px solid #FECACA;
      border-radius: 3px;
      font-family: 'SFMono-Regular', Consolas, monospace;
      font-size: 12px;
      color: var(--text-dark);
      white-space: pre;
    }

    /* ── Footer ── */
    .page-footer {
      max-width: 1200px;
      margin: 40px auto 0;
      padding: 18px 1.5rem;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--text-faint);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }
    .page-footer a { color: var(--text-muted); text-decoration: none; }
    .page-footer a:hover { color: var(--text-body); }
  
    /* ── Mobile responsiveness ───────────────────────────────── */
    @media (max-width: 640px) {
      .nav-inner    { padding: 0 0.875rem; }
      .nav-brand    { font-size: 16px; gap: 8px; }
      .nav-brand-sub{ font-size: 10px; letter-spacing: 0.04em; }
      .nav-back     { margin-left: 14px; font-size: 11px; }
      .lang-btn     { padding: 3px 8px; font-size: 10px; }
      .tool-tab     { padding: 10px 14px; font-size: 12.5px; }
    }
    @media (max-width: 480px) {
      .nav-brand-sub, .nav-brand-sep { display: none; }
      .nav-back     { margin-left: 12px; }
      .tool-tab     { padding: 9px 11px; font-size: 12px; letter-spacing: 0; }
      .page-footer  { font-size: 10.5px; padding: 14px 0.875rem; flex-direction: column;
                      align-items: flex-start; gap: 4px; }
    }
    @media (max-width: 380px) {
      .nav-back span{ display: none; }
      .nav-back::after { content: "←"; font-size: 14px; }
    }
    body { overflow-x: hidden; }

    /* ── Zoom + Pan control ── */
    .zoom-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 20px;
      background: rgba(0,0,0,0.15);
      border-bottom: 1px solid rgba(200,200,216,0.08);
      justify-content: flex-end;
    }
    .zoom-bar label {
      font-size: 10px;
      color: #9aa0c0;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .zoom-bar input[type=range] {
      width: 100px;
      accent-color: #90CAF9;
      cursor: pointer;
    }
    .zoom-bar button {
      background: transparent;
      border: 1px solid rgba(200,200,216,0.2);
      color: #90CAF9;
      border-radius: 3px;
      padding: 2px 8px;
      font-size: 11px;
      cursor: pointer;
      font-family: inherit;
    }
    .zoom-bar button:hover { background: rgba(144,202,249,0.1); }
    .zoom-bar .zoom-pct { font-size: 10px; color: #9aa0c0; min-width: 34px; text-align: right; }
    /* zoom-wrap: zoom applied here directly so mouse events on React children
       are never intercepted by an intermediate scroll container */
    .viz-zoom-wrap {
      overflow: auto;
      max-height: 90vh;
      zoom: 1;
      transition: zoom 0.1s;
    }
  </style>
</head>
<body>

  <!-- ── Nav — identical structure to index.html ── -->
  <nav class="nav" role="navigation">
    <div class="nav-inner">
      <a class="nav-brand" href="index.html">
        <span>AGW</span>
        <span class="nav-brand-sep"></span>
        <span class="nav-brand-sub">Verein für Socialpolitik</span>
      </a>
      <a class="nav-back" href="index.html"><span class="back-arrow">←</span> <span class="back-text" data-str="nav_back_main">Zur Tagungsseite</span></a>
      <div class="nav-actions">
        <div class="lang-toggle" role="group" aria-label="Language">
          <button class="lang-btn active" id="btn-de" onclick="setLang('de')">DE</button>
          <button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button>
        </div>
      </div>
    </div>
  </nav>

  <!-- ── Tab bar — same style as archive tabs in index.html ── -->
  <div class="tool-tabs" role="tablist">
    <button class="tool-tab active" id="tab-gaze"
      onclick="showTool('gaze',this)"><span class="ico ico-map" aria-hidden="true"></span> <span data-str="tab_gaze">Rezeptionsatlas</span></button>
    <button class="tool-tab" id="tab-analysis"
      onclick="showTool('analysis',this)"><span class="ico ico-chart" aria-hidden="true"></span> <span data-str="tab_analysis">Analysen</span></button>
    <button class="tool-tab" id="tab-pmi"
      onclick="showTool('pmi',this)"><span class="ico ico-topic" aria-hidden="true"></span> <span data-str="tab_pmi">Themenanalyse</span></button>
    <button class="tool-tab" id="tab-lineage"
      onclick="showTool('lineage',this)"><span class="ico ico-trend" aria-hidden="true"></span> <span data-str="tab_lineage">Stammbaum</span></button>
  </div>


  <!-- ── Zoom control bar ── -->
  <div class="zoom-bar" id="zoom-bar">
    <label>Zoom</label>
    <button onclick="adjustZoom(-0.1)">−</button>
    <input type="range" id="zoom-slider" min="0.4" max="2.5" step="0.05" value="1"
      oninput="setZoom(parseFloat(this.value))" />
    <button onclick="adjustZoom(0.1)">+</button>
    <span class="zoom-pct" id="zoom-pct">100%</span>
    <button onclick="setZoom(1)" style="margin-left:4px">Reset</button>
  </div>
  <!-- ── Panels ── -->
  <main>
    <div class="tool-panel active" id="panel-gaze">
      <div class="loading" id="loading-gaze" data-str="loading">Lädt…</div>
      <div class="viz-zoom-wrap" id="wrap-mount-gaze"><div id="mount-gaze"></div></div>
    </div>
    <div class="tool-panel" id="panel-analysis">
      <div class="loading" id="loading-analysis" data-str="loading">Lade Analysen…</div>
      <div class="viz-zoom-wrap" id="wrap-mount-analysis"><div id="mount-analysis"></div></div>
    </div>
    <div class="tool-panel" id="panel-pmi">
      <div class="loading" id="loading-pmi" data-str="loading">Lade Themenanalyse…</div>
      <div class="viz-zoom-wrap" id="wrap-mount-pmi"><div id="mount-pmi"></div></div>
    </div>
    <div class="tool-panel" id="panel-lineage">
      <div class="viz-zoom-wrap" id="wrap-mount-lineage"><div id="hetl-mount"></div></div>
    </div>
  </main>

  <footer class="page-footer">
    <span>AGW · Ausschuss für die Geschichte der Wirtschaftswissenschaften · Verein für Socialpolitik</span>
    <span>© 2026 · <a href="mailto:bieri@vt.edu">David Bieri</a></span>
  </footer>

  <script src="agw_strings.js"></script>
  <!-- ── Language + tab logic ── -->
  <script>
    /* Language — delegates to agw_strings.js (AGW global) */
    let lang = AGW.getLang();

    function setLang(l) {
      lang = l;
      document.documentElement.lang = l;
      AGW.setLang(l);
      document.getElementById('btn-de').classList.toggle('active', l === 'de');
      document.getElementById('btn-en').classList.toggle('active', l === 'en');
      AGW.applyLang(l);
    }

    var lineageLoaded = false;
    function showTool(name, btn) {
      document.querySelectorAll('.tool-panel').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.tool-tab').forEach(b => b.classList.remove('active'));
      document.getElementById('panel-' + name).classList.add('active');
      btn.classList.add('active');
      if (name === 'lineage' && !lineageLoaded) {
        lineageLoaded = true;
        ['agw_lineage_data.js', 'agw_lineage.js'].forEach(function(src) {
          var s = document.createElement('script'); s.src = src; document.body.appendChild(s);
        });
      }
    }

    function showBundleError(mountId, loadingId, filename) {
      document.getElementById(loadingId).style.display = 'none';
      document.getElementById(mountId).innerHTML =
        '<div class="bundle-error">' +
        '<strong>' + AGW.t('bundle_title', lang) + ': dist/' + filename + '</strong><br>' +
        AGW.t('bundle_body', lang) +
        '<code>bash build_analytics.sh</code>' +
        AGW.t('bundle_hint', lang) + '</div>';
    }

    setLang(lang);
  </script>

  <!-- ── Mount React components from esbuild bundles ── -->
  <script type="module">
    import { createElement }  from 'react';
    import { createRoot }     from 'react-dom/client';

    function mount(panelId, mountId, loadingId, bundlePath, state) {
      if (state.done) return;
      state.done = true;
      import(bundlePath).then(mod => {
        document.getElementById(loadingId).style.display = 'none';
        createRoot(document.getElementById(mountId))
          .render(createElement(mod.default, null));
      }).catch(() => {
        showBundleError(mountId, loadingId,
          bundlePath.replace('./dist/', ''));
      });
    }

    const s = { gaze:{}, analysis:{}, pmi:{} };

    /* Load all tabs on click — consistent deferred loading for all React bundles */
    document.getElementById('tab-gaze')
      .addEventListener('click', () =>
        mount('panel-gaze', 'mount-gaze', 'loading-gaze',
              './dist/agw_gaze_map.js', s.gaze));

    document.getElementById('tab-analysis')
      .addEventListener('click', () =>
        mount('panel-analysis', 'mount-analysis', 'loading-analysis',
              './dist/agw_analysis.js', s.analysis));

    document.getElementById('tab-pmi')
      .addEventListener('click', () =>
        mount('panel-pmi', 'mount-pmi', 'loading-pmi',
              './dist/agw_pmi.js', s.pmi));

    /* Auto-trigger gaze map after a short defer so importmap is settled */
    setTimeout(() =>
      mount('panel-gaze', 'mount-gaze', 'loading-gaze',
            './dist/agw_gaze_map.js', s.gaze), 200);
  
    /* ── Zoom + Pan — CSS zoom on inner div, overflow:auto on outer for scrollbars ── */
    window._zoomLevel = 1;
    window.setZoom = function(z) {
      window._zoomLevel = Math.min(2.5, Math.max(0.4, z));
      document.querySelectorAll('.viz-zoom-wrap').forEach(function(el) {
        el.style.zoom = window._zoomLevel;
      });
      var sl = document.getElementById('zoom-slider');
      var pct = document.getElementById('zoom-pct');
      if (sl) sl.value = window._zoomLevel;
      if (pct) pct.textContent = Math.round(window._zoomLevel * 100) + '%';
    };
    window.adjustZoom = function(delta) { window.setZoom(window._zoomLevel + delta); };

  </script>

</body>
</html>
